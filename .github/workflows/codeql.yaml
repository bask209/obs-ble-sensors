name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (C/C++, full plugin)
    runs-on: windows-2022
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
      - name: Build plugin and tests
        shell: pwsh
        run: |
          cmake --preset windows-x64
          cmake --build build_x64 --config Release --parallel
          cmake -S tests -B build_tests
          cmake --build build_tests --config Release --parallel
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          category: c-cpp
