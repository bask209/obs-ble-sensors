name: Build and test

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests -B build_tests -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build_tests --config Release --parallel
      - name: Run
        run: ctest --test-dir build_tests -C Release --output-on-failure

  windows-plugin:
    name: Windows x64 plugin
    runs-on: windows-2022
    needs: unit-tests
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Cache OBS dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: obs-deps-${{ hashFiles('buildspec.json') }}
      - name: Configure (warnings as errors)
        run: cmake --preset windows-ci-x64
      - name: Build Release
        run: cmake --build --preset windows-ci-x64 --parallel
      - name: Verify the release build contains no simulated backend
        run: |
          $dll = 'build_x64/Release/obs-ble-sensors.dll'
          if (Select-String -Path $dll -Pattern 'Simulated HRM' -SimpleMatch -Quiet) { throw 'mock backend found in release DLL' }
      - name: Package
        run: ./scripts/package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: obs-ble-sensors-windows-x64
          path: |
            release/*.zip
            release/*-setup.exe

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows-plugin
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: obs-ble-sensors-windows-x64
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" *-setup.exe *.zip --repo "${GITHUB_REPOSITORY}" --title "OBS BLE Sensors ${GITHUB_REF_NAME}" --generate-notes ${prerelease}
