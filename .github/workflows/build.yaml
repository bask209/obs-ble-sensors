name: Build and test

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs that publish request more explicitly.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S tests -B build_tests -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build_tests --config Release --parallel
      - name: Run
        run: ctest --test-dir build_tests -C Release --output-on-failure

  sanitizers:
    name: Unit tests under sanitizers (${{ matrix.os }}, ${{ matrix.flags }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            flags: -fsanitize=address -Zi -EHsc
          - os: ubuntu-24.04
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer -g
          - os: ubuntu-24.04
            flags: -fsanitize=thread -g -O1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        shell: bash
        run: MSYS_NO_PATHCONV=1 cmake -S tests -B build_asan -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
      - name: Build
        run: cmake --build build_asan --config RelWithDebInfo --target ble-sensors-tests --parallel
      - name: Run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asan = Split-Path (Get-ChildItem -Recurse "${env:ProgramFiles}\Microsoft Visual Studio" -Filter clang_rt.asan_dynamic-x86_64.dll | Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1).FullName
          $env:PATH = "$asan;$env:PATH"
          ./build_asan/RelWithDebInfo/ble-sensors-tests.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run (Linux)
        if: runner.os == 'Linux'
        run: ./build_asan/ble-sensors-tests

  fuzz:
    name: Coverage-guided fuzzing (libFuzzer + ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build fuzzer
        run: |
          cmake -S tests -B build_fuzz -DBLEHR_FUZZ=ON -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build_fuzz --target ble-fuzz --parallel
      - name: Fuzz for 3 minutes
        run: ./build_fuzz/ble-fuzz -max_total_time=180 -print_final_stats=1 -max_len=256

  windows-plugin:
    name: Windows x64 plugin
    runs-on: windows-2022
    needs: [unit-tests, sanitizers, fuzz]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache OBS dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .deps
          key: obs-deps-${{ hashFiles('buildspec.json') }}
      - name: Configure (warnings as errors)
        run: cmake --preset windows-ci-x64
      - name: Build Release
        run: cmake --build --preset windows-ci-x64 --parallel
      - name: Verify the release build contains no simulated backend
        run: |
          $dll = 'build_x64/Release/obs-ble-sensors.dll'
          if (Select-String -Path $dll -Pattern 'Simulated HRM' -SimpleMatch -Quiet) { throw 'mock backend found in release DLL' }
      - name: Package
        run: ./scripts/package.ps1 -SkipBuild
      - name: Checksums
        run: |
          Get-ChildItem release/*.zip, release/*-setup.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obs-ble-sensors-windows-x64
          path: |
            release/*.zip
            release/*-setup.exe
            release/SHA256SUMS.txt

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows-plugin
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write     # build-provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: obs-ble-sensors-windows-x64
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            *-setup.exe
            *.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" *-setup.exe *.zip SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --title "OBS BLE Sensors ${GITHUB_REF_NAME}" --generate-notes ${prerelease}
